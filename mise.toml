[tools]
"github:YewFence/forgejo-cli" = "latest"
pinact = "latest"
python = "latest"
ruff = "latest"
uv = "latest"

[tasks.check]
description = "Run all code quality checks"
depends = ["lint", "test"]
alias = "c"

[tasks.lint]
description = "Run ruff check"
run = "ruff check ."

[tasks.test]
description = "Run all unit and local integration tests"
run = "uv run python -m unittest discover -s tests -v"

[tasks.mirror-render]
description = "Validate mirrors.toml and render the mirror matrix"
run = "uv run python scripts/render-mirror-matrix.py"

[tasks.mirror-plan-summary]
description = "Read a mirror matrix from stdin and render its sync plan"
run = "uv run python scripts/render-workflow-summary.py mirror-plan"

[tasks.mirror-result-summary]
description = "Read a mirror result from stdin and render its summary"
usage = '''
arg "<name>" help="Mirror name"
arg "<source>" help="Source repository URL"
'''
run = '''
uv run python scripts/render-workflow-summary.py mirror-result \
  --name "${usage_name?}" \
  --source "${usage_source?}"
'''

[tasks.mirror-sync]
description = "Mirror and archive one repository's default branch"
run = "uv run python scripts/mirror-default-branch.py"
