[tools]
"github:YewFence/forgejo-cli" = "latest"
pinact = "latest"
python = "latest"
uv = "latest"

[tasks.test]
description = "Run all unit and local integration tests"
run = "uv run python -m unittest discover -s tests -v"

[tasks.mirror-render]
description = "Validate mirrors.toml and render the mirror matrix"
run = "uv run python scripts/render-mirror-matrix.py"

[tasks.mirror-sync]
description = "Mirror and archive one repository's default branch"
run = "uv run python scripts/mirror-default-branch.py"
