#:schema https://fnox.jdx.dev/schema.json

[providers]
age = { type = "age", recipients = ["age1m78uhvvgrwg63cp9dcwr64hvjmzyj8cemmr9vlsvgnj6ydnvaguq8cg7tn"] }

[secrets]
INFISICAL_MIRROR_URL= { provider = "age", value = "" }
INFISICAL_MIRROR_USERNAME= { provider = "age", value = "" }
INFISICAL_MIRROR_TOKEN= { provider = "age", value = "" }
# INFISICAL_MIRROR_URL      目标私有仓库的 HTTPS 地址
# INFISICAL_MIRROR_USERNAME 目标远端的 HTTPS 用户名
# INFISICAL_MIRROR_TOKEN    目标远端的 HTTPS token（GitHub PAT）
#
# 用 `fnox set` 写入真实值（默认使用上面的 age provider 加密）：
#   fnox set INFISICAL_MIRROR_URL https://github.com/you/infisical.git
#   fnox set INFISICAL_MIRROR_USERNAME you
#   fnox set INFISICAL_MIRROR_TOKEN ghp_xxx
