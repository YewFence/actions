name: Build Container Images

on:
  workflow_dispatch:
    inputs:
      name:
        description: Bake target name (leave empty to build all targets)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - docker-bake.hcl
      - mise.toml
      - .github/workflows/build-images.yml
  pull_request:
    paths:
      - docker-bake.hcl
      - mise.toml
      - .github/workflows/build-images.yml

concurrency:
  group: build-container-images
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.normalize.outputs.matrix }}
      targets: ${{ steps.normalize.outputs.targets }}

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Infisical secrets
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "yew-fence-actions"
          identity-id: "3fc82245-d8ef-4c4a-bb18-15db31b794dc"

      - name: Materialize Bake overrides
        id: bake-files
        env:
          SELECTED_NAME: ${{ github.event.inputs.name || '' }}
          BAKE_OVERRIDE: ${{ env.DOCKER_BAKE_HCL || '' }}
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/infisical-bake.hcl"
          if [[ -n "$BAKE_OVERRIDE" ]]; then
            printf '%s' "$BAKE_OVERRIDE" > "$override"
          else
            : > "$override"
          fi
          if [[ -n "$SELECTED_NAME" ]]; then
            target="$SELECTED_NAME"
            group="$RUNNER_TEMP/generated-default.hcl"
            : > "$group"
          else
            target_names="$(docker buildx bake \
              --file docker-bake.hcl \
              --file "$override" \
              --list=targets |
              awk 'NR > 1 && $1 != "default" { print $1 }')"
            if [[ -z "$target_names" ]]; then
              printf 'Bake configuration contains no targets\n' >&2
              exit 1
            fi
            group="$RUNNER_TEMP/generated-default.hcl"
            {
              printf 'group "generated-default" {\n  targets = [\n'
              while IFS= read -r target_name; do
                printf '    "%s",\n' "$target_name"
              done <<< "$target_names"
              printf '  ]\n}\n'
            } > "$group"
            target=generated-default
          fi
          {
            printf 'override=%s\n' "$override"
            printf 'group=%s\n' "$group"
            printf 'target=%s\n' "$target"
          } >> "$GITHUB_OUTPUT"
          printf 'DOCKER_BAKE_HCL=\n' >> "$GITHUB_ENV"

      - name: Test repository code
        run: mise run test

      - name: Generate Bake matrix
        id: matrix
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: |
            docker-bake.hcl
            ${{ steps.bake-files.outputs.override }}
            ${{ steps.bake-files.outputs.group }}
          target: ${{ steps.bake-files.outputs.target }}
          fields: platforms

      - name: Normalize Bake matrix
        id: normalize
        env:
          MATRIX_JSON: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          printf 'matrix=%s\n' "$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          targets="$(jq -c 'map(.target) | unique | map({target: .})' <<< "$MATRIX_JSON")"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"

  smoke-build:
    if: github.event_name == 'pull_request'
    needs: check
    permissions:
      contents: read
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Smoke build ${{ matrix.target }} (${{ matrix.platforms }})

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Smoke build image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.platforms=${{ matrix.platforms }}
            ${{ matrix.target }}.output=type=cacheonly

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Build ${{ matrix.target }} (${{ matrix.platforms }})

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Infisical secrets
        continue-on-error: true
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "yew-fence-actions"
          identity-id: "3fc82245-d8ef-4c4a-bb18-15db31b794dc"

      - name: Materialize Bake overrides
        id: bake-files
        env:
          TARGET: ${{ matrix.target }}
          BAKE_OVERRIDE: ${{ env.DOCKER_BAKE_HCL || '' }}
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/infisical-bake.hcl"
          if [[ -n "$BAKE_OVERRIDE" ]]; then
            printf '%s' "$BAKE_OVERRIDE" > "$override"
          else
            : > "$override"
          fi
          printf 'target "%s" {\n  secret = ["id=GIT_AUTH_TOKEN,env=GIT_AUTH_TOKEN"]\n}\n' "$TARGET" >> "$override"
          printf 'override=%s\n' "$override" >> "$GITHUB_OUTPUT"
          printf 'DOCKER_BAKE_HCL=\n' >> "$GITHUB_ENV"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image by digest
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          BUILDX_BAKE_GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTH_HEADER: bearer
          GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          files: |
            docker-bake.hcl
            ${{ steps.bake-files.outputs.override }}
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.platforms=${{ matrix.platforms }}
            ${{ matrix.target }}.output=type=registry,name=ghcr.io/yewfence/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
            ${{ matrix.target }}.cache-from=type=gha,scope=${{ matrix.target }}-${{ matrix.platforms }}
            ${{ matrix.target }}.cache-to=type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platforms }}

      - name: Export image digest
        id: digest
        env:
          TARGET: ${{ matrix.target }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          digest="$(jq -er --arg target "$TARGET" '.[$target]["containerimage.digest"]' <<< "$METADATA")"
          mkdir -p "$RUNNER_TEMP/digests"
          : > "$RUNNER_TEMP/digests/${digest#sha256:}"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.target }}-${{ matrix.platforms == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    if: github.event_name != 'pull_request'
    needs: [check, publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    name: Publish manifest ${{ matrix.target }}

    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-${{ matrix.target }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        id: manifest
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP/digests"/*)
          if (( ${#digest_files[@]} == 0 )); then
            printf 'No image digests found for %s\n' "$TARGET" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("ghcr.io/yewfence/${TARGET}@sha256:$(basename "$digest_file")")
          done

          image="ghcr.io/yewfence/${TARGET}:latest"
          docker buildx imagetools create --tag "$image" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  cleanup:
    if: github.event_name != 'pull_request'
    needs: [check, publish-manifest]
    permissions:
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    name: Cleanup ${{ matrix.target }}

    steps:
      - name: Delete old untagged image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: yewfence
          package-name: ${{ matrix.target }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
