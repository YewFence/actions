name: Build Container Images

on:
  workflow_dispatch:
    inputs:
      name:
        description: Image name (leave empty to build all images)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - images.toml
      - scripts/render-image-matrix.py
      - scripts/render-workflow-summary.py
      - tests/test_render_image_matrix.py
      - tests/test_render_workflow_summary.py
      - mise.toml
      - .github/workflows/build-images.yml
  pull_request:
    paths:
      - images.toml
      - scripts/render-image-matrix.py
      - scripts/render-workflow-summary.py
      - tests/test_render_image_matrix.py
      - tests/test_render_workflow_summary.py
      - mise.toml
      - .github/workflows/build-images.yml

concurrency:
  group: build-container-images
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Set up Infisical secrets
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "yew-fence-actions"
          identity-id: "3fc82245-d8ef-4c4a-bb18-15db31b794dc"

      - name: Test matrix renderer
        run: mise run test

      - name: Render build matrix
        id: matrix
        env:
          SELECTED_NAME: ${{ github.event.inputs.name || '' }}
        run: |
          set -euo pipefail
          matrix="$(mise run image-render -- --name "$SELECTED_NAME")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

          printf '%s' "$matrix" |
            mise run --raw image-plan-summary >> "$GITHUB_STEP_SUMMARY"

  smoke-build:
    if: github.event_name == 'pull_request'
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Smoke build ${{ matrix.name }}

    steps:
      - name: Check out upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false

      - name: Record source commit
        id: source
        run: |
          set -euo pipefail
          commit="$(git -C source rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Smoke build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: source/${{ matrix.context }}
          file: source/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          provenance: false

      - name: Summarize smoke build
        env:
          IMAGE_NAME: ${{ matrix.name }}
          SOURCE_REPOSITORY: ${{ matrix.repository }}
          SOURCE_REF: ${{ matrix.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          {
            printf "## Smoke build passed\n\n"
            printf -- "- Image: \`%s\`\n" "$IMAGE_NAME"
            printf -- "- Source: \`%s@%s\`\n" "$SOURCE_REPOSITORY" "$SOURCE_REF"
            printf -- "- Resolved commit: \`%s\`\n" "$SOURCE_COMMIT"
            printf -- "- Platforms: \`%s\`\n" "$PLATFORMS"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Publish ${{ matrix.name }}

    steps:
      - name: Check out orchestrator configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orchestrator
          persist-credentials: false

      - name: Set up Infisical secrets
        continue-on-error: true
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "yew-fence-actions"
          identity-id: "3fc82245-d8ef-4c4a-bb18-15db31b794dc"

      - name: Configure private source credentials
        run: |
          set -euo pipefail
          python orchestrator/scripts/render-image-matrix.py \
            --config orchestrator/images.toml \
            --name '${{ matrix.name }}' \
            --credentials-env-file "$GITHUB_ENV"

      - name: Check out upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
          token: ${{ env.SOURCE_PASSWORD || github.token }}

      - name: Clear source credentials
        run: |
          set -euo pipefail
          {
            printf 'IMAGES_TOML=\n'
            printf 'SOURCE_USERNAME=\n'
            printf 'SOURCE_PASSWORD=\n'
          } >> "$GITHUB_ENV"

      - name: Record source metadata
        id: source
        run: |
          set -euo pipefail
          commit="$(git -C source rev-parse HEAD)"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$created" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: source/${{ matrix.context }}
          file: source/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: ghcr.io/yewfence/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summarize published image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          SOURCE_REPOSITORY: ${{ matrix.repository }}
          SOURCE_REF: ${{ matrix.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf "## Published image\n\n"
            printf -- "- Image: \`ghcr.io/yewfence/%s:latest\`\n" "$IMAGE_NAME"
            printf -- "- Source: \`%s@%s\`\n" "$SOURCE_REPOSITORY" "$SOURCE_REF"
            printf -- "- Resolved commit: \`%s\`\n" "$SOURCE_COMMIT"
            printf -- "- Digest: \`%s\`\n" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name != 'pull_request'
    needs: [check, publish]
    permissions:
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Cleanup ${{ matrix.name }}

    steps:
      - name: Delete old untagged image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: yewfence
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
