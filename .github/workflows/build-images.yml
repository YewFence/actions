name: Build Container Images

on:
  workflow_dispatch:
    inputs:
      name:
        description: Bake target name (leave empty to build all targets)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - docker-bake.hcl
      - scripts/prepare-image-release.py
      - scripts/publish-image-manifest.py
      - tests/test_image_release.py
      - pyproject.toml
      - uv.lock
      - images/**
      - private-repo-bake.hcl.bin
      - .sops.yaml
      - .yewseal.toml
      - mise.lock
      - mise.toml
      - .github/workflows/build-images.yml
  pull_request:
    paths:
      - docker-bake.hcl
      - scripts/prepare-image-release.py
      - scripts/publish-image-manifest.py
      - tests/test_image_release.py
      - pyproject.toml
      - uv.lock
      - images/**
      - private-repo-bake.hcl.bin
      - .sops.yaml
      - .yewseal.toml
      - mise.lock
      - mise.toml
      - .github/workflows/build-images.yml

concurrency:
  group: build-container-images
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.normalize.outputs.matrix }}
      targets: ${{ steps.normalize.outputs.targets }}

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Decrypt private Bake config
        if: github.event_name != 'pull_request'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: yews decrypt

      - name: Materialize Bake overrides
        id: bake-files
        env:
          SELECTED_NAME: ${{ github.event.inputs.name || '' }}
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/private-repo-bake.hcl"
          if [[ -f private-repo-bake.hcl ]]; then
            cp private-repo-bake.hcl "$override"
          else
            : > "$override"
          fi
          if [[ -n "$SELECTED_NAME" ]]; then
            target="$SELECTED_NAME"
            group="$RUNNER_TEMP/generated-default.hcl"
            : > "$group"
          else
            target_names="$(docker buildx bake \
              --file docker-bake.hcl \
              --file "$override" \
              --list=targets |
              awk 'NR > 1 && $1 != "default" { print $1 }')"
            if [[ -z "$target_names" ]]; then
              printf 'Bake configuration contains no targets\n' >&2
              exit 1
            fi
            group="$RUNNER_TEMP/generated-default.hcl"
            {
              printf 'group "generated-default" {\n  targets = [\n'
              while IFS= read -r target_name; do
                printf '    "%s",\n' "$target_name"
              done <<< "$target_names"
              printf '  ]\n}\n'
            } > "$group"
            target=generated-default
          fi
          {
            printf 'override=%s\n' "$override"
            printf 'group=%s\n' "$group"
            printf 'target=%s\n' "$target"
          } >> "$GITHUB_OUTPUT"

      - name: Test repository code
        run: mise run test

      - name: Generate Bake matrix
        id: matrix
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: |
            docker-bake.hcl
            ${{ steps.bake-files.outputs.override }}
            ${{ steps.bake-files.outputs.group }}
          target: ${{ steps.bake-files.outputs.target }}
          fields: platforms

      - name: Normalize Bake matrix
        id: normalize
        env:
          MATRIX_JSON: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          printf 'matrix=%s\n' "$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          targets="$(jq -c 'map(.target) | unique | map({target: .})' <<< "$MATRIX_JSON")"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"

  smoke-build:
    if: github.event_name == 'pull_request'
    needs: check
    permissions:
      contents: read
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Smoke build ${{ matrix.target }} (${{ matrix.platforms }})

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke build image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.platform=${{ matrix.platforms }}
            ${{ matrix.target }}.output=type=cacheonly

  prepare-release:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    name: Prepare release ${{ matrix.target }}

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Decrypt private Bake config
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: yews decrypt

      - name: Identify source repository
        id: source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          source="$(mise run images:prepare "$TARGET" "$RUNNER_TEMP/release" --source-only)"
          jq -er '"owner=\(.owner)", "repository=\(.repository)"' <<< "$source" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.repository }}
          permission-contents: read

      - name: Prepare pinned release plan
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: >-
          mise run images:prepare "$TARGET" "$RUNNER_TEMP/release"
          --checkout-repository "$GITHUB_REPOSITORY"
          --checkout-revision "$GITHUB_SHA"
          --checkout-ref "$GITHUB_REF"

      - name: Upload release plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-release-${{ matrix.target }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: [check, prepare-release]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Build ${{ matrix.target }} (${{ matrix.platforms }})

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-release-${{ matrix.target }}
          path: ${{ runner.temp }}/release

      - name: Read source repository
        id: release
        run: |
          jq -er '"owner=\(.owner)", "repository=\(.repository)"' "$RUNNER_TEMP/release/release.json" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        # The App is only installed on our own accounts and orgs; for any
        # other context owner this probe fails and the build falls back to
        # GITHUB_TOKEN (public repos) below.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ steps.release.outputs.owner }}
          repositories: ${{ steps.release.outputs.repository }}
          permission-contents: read

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image by digest
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # A failed app-token probe (context owner without our App
          # installation) leaves the output empty; public third-party
          # contexts then authenticate with GITHUB_TOKEN.
          BUILDX_BAKE_GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          files: cwd://${{ runner.temp }}/release/bake.json
          targets: ${{ matrix.target }}
          provenance: false
          set: |
            ${{ matrix.target }}.platform=${{ matrix.platforms }}
            ${{ matrix.target }}.secret=id=GIT_AUTH_TOKEN,env=GIT_AUTH_TOKEN
            ${{ matrix.target }}.output=type=registry,name=ghcr.io/yewfence/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
            ${{ matrix.target }}.cache-from=type=gha,scope=${{ matrix.target }}-${{ matrix.platforms }}
            ${{ matrix.target }}.cache-to=type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platforms }}

      - name: Export image digest
        id: digest
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/bake-metadata.json"
          cat <<'METADATA_EOF' > "$metadata"
          ${{ steps.build.outputs.metadata }}
          METADATA_EOF
          digest="$(jq -er --arg target "$TARGET" '.[$target]["containerimage.digest"]' "$metadata")"
          mkdir -p "$RUNNER_TEMP/digests"
          : > "$RUNNER_TEMP/digests/${digest#sha256:}"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.platforms == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ matrix.target }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    if: github.event_name != 'pull_request'
    needs: [check, publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    name: Publish manifest ${{ matrix.target }}

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Download release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-release-${{ matrix.target }}
          path: ${{ runner.temp }}/release

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*-${{ matrix.target }}
          path: ${{ runner.temp }}/release/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        run: mise run images:manifest "$RUNNER_TEMP/release"

  cleanup:
    if: github.event_name != 'pull_request'
    needs: [check, publish-manifest]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    name: Cleanup ${{ matrix.target }}

    steps:
      - name: Delete old unreferenced image versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ matrix.target }}
          tag-selection: untagged
          cut-off: 7d
