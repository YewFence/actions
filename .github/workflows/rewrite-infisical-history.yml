name: Rewrite Infisical History

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: rewrite-infisical-history
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rewrite-and-push:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPO: https://github.com/infisical/infisical.git
      TARGET_REMOTE_URL: ${{ vars.TARGET_REMOTE_URL || secrets.TARGET_REMOTE_URL }}
      TARGET_REMOTE_BRANCH: ${{ vars.TARGET_REMOTE_BRANCH || secrets.TARGET_REMOTE_BRANCH }}
      TARGET_REMOTE_USERNAME: ${{ secrets.TARGET_REMOTE_USERNAME }}
      TARGET_REMOTE_PASSWORD: ${{ secrets.TARGET_REMOTE_PASSWORD }}
      GIT_USER_NAME: ${{ vars.GIT_USER_NAME || secrets.GIT_USER_NAME || 'github-actions[bot]' }}
      GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL || secrets.GIT_USER_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      MISE_OFFLINE: "0"

    steps:
      - name: Check required settings
        run: |
          set -euo pipefail
          : "${TARGET_REMOTE_URL:?missing TARGET_REMOTE_URL}"
          : "${TARGET_REMOTE_BRANCH:?missing TARGET_REMOTE_BRANCH}"
          : "${TARGET_REMOTE_USERNAME:?missing TARGET_REMOTE_USERNAME}"
          : "${TARGET_REMOTE_PASSWORD:?missing TARGET_REMOTE_PASSWORD}"
          : "${GIT_USER_NAME:?missing GIT_USER_NAME}"
          : "${GIT_USER_EMAIL:?missing GIT_USER_EMAIL}"

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install rewrite tools
        run: |
          set -euo pipefail
          mise use -y rust@latest cargo:filter-repo-rs@latest
          mise exec -- rustc --version
          mise exec -- cargo --version
          mise exec -- filter-repo-rs --version

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --depth 100 --branch main --single-branch --tags "$SOURCE_REPO" source

      - name: Remove docs from history
        run: |
          set -euo pipefail
          cd source
          mise exec -- filter-repo-rs --path docs --force --invert-paths

      - name: Configure target remote
        run: |
          set -euo pipefail
          cd source
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          remote="${TARGET_REMOTE_URL#https://}"
          remote="${remote#http://}"
          host="${remote%%/*}"
          if [[ "$host" == "$remote" ]]; then
            echo "TARGET_REMOTE_URL must include a host and repository path" >&2
            exit 1
          fi
          git config --global credential.helper store
          printf 'protocol=https\nhost=%s\nusername=%s\npassword=%s\n\n' \
            "$host" \
            "$TARGET_REMOTE_USERNAME" \
            "$TARGET_REMOTE_PASSWORD" | git credential approve
          git remote add target "https://${remote}"

      - name: Push rewritten branch and tags
        run: |
          set -euo pipefail
          cd source

          tags=()
          while IFS= read -r tag; do
            commit="$(git rev-list -n 1 "${tag}^{commit}" 2>/dev/null || true)"
            if [[ -n "$commit" ]] && git merge-base --is-ancestor "$commit" HEAD 2>/dev/null; then
              tags+=("$tag")
            fi
          done < <(git for-each-ref --format='%(refname:strip=2)' refs/tags)

          git push --force target "HEAD:${TARGET_REMOTE_BRANCH}"

          for tag in "${tags[@]}"; do
            git push --force target "$tag"
          done
