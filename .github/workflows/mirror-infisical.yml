name: Mirror Infisical

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-infisical
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    env:
      INFISICAL_MIRROR_BRANCH: ${{ vars.INFISICAL_MIRROR_BRANCH || 'main' }}
      CUSTOM_BRANCH: ${{ vars.CUSTOM_BRANCH || 'custom' }}
      GIT_USER_NAME: ${{ vars.GIT_USER_NAME || 'github-actions[bot]' }}
      GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not let the injected GITHUB_TOKEN hijack github.com auth for
          # the mirror script; the script supplies its own credentials.
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Mirror and rebase
        run: mise run infisical-mirror
