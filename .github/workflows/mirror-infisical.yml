name: Mirror Infisical

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-infisical
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      INFISICAL_MIRROR_BRANCH: ${{ vars.INFISICAL_MIRROR_BRANCH || 'main' }}
      CUSTOM_BRANCH: ${{ vars.CUSTOM_BRANCH || 'custom' }}
      GIT_USER_NAME: ${{ vars.GIT_USER_NAME || 'github-actions[bot]' }}
      GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not let the injected GITHUB_TOKEN hijack github.com auth for
          # the mirror script; the script supplies its own credentials.
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Register log masks
        run: |
          # Expand secrets inside the fnox child shell after decryption.
          # shellcheck disable=SC2016
          fnox exec -- bash -c '
            for name in INFISICAL_MIRROR_URL INFISICAL_MIRROR_USERNAME INFISICAL_MIRROR_TOKEN; do
              printf "::add-mask::%s\n" "${!name}"
            done
          '

      - name: Mirror and rebase
        run: mise run infisical-mirror
