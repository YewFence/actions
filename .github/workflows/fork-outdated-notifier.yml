name: Fork Outdated Notifier

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: fork-outdated-notifier
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORKS_GH_TOKEN: ${{ secrets.FORKS_GH_TOKEN || github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Check outdated forks
        run: mise run forks-check >> "$GITHUB_STEP_SUMMARY"
