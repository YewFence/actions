name: Build Prebuilt Binaries

on:
  workflow_dispatch:
    inputs:
      name:
        description: Tool in binaries.toml
        type: choice
        options: [josh]
        default: josh
      publish:
        description: Publish the signed binaries to GitHub Releases
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - binaries.toml
      - binaries/**
      - scripts/*-binary-release.py
      - .github/workflows/build-binaries.yml
  pull_request:
    paths:
      - binaries.toml
      - binaries/**
      - scripts/*-binary-release.py
      - tests/test_binary_release.py
      - .github/workflows/build-binaries.yml

concurrency:
  group: build-binaries-${{ github.event.inputs.name || 'josh' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Test repository code
        run: mise run check
      - name: Prepare pinned release plan
        id: plan
        env:
          TOOL_NAME: ${{ github.event.inputs.name || 'josh' }}
        run: |
          mise run binaries:prepare "$TOOL_NAME" "$RUNNER_TEMP/release" --recipe-revision "$GITHUB_SHA"
          jq -r '"matrix=\(.matrix | tojson)", "name=\(.name)", "version=\(.version)", "tag=\(.tag)"' \
            "$RUNNER_TEMP/release/release.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-release-plan
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-release-plan
          path: ${{ runner.temp }}/release
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: mise run binaries:build "$RUNNER_TEMP/release" "$TARGET" --gha-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign:
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        id: packslip
        with:
          project: github.com/${{ github.repository }}/${{ needs.prepare.outputs.name }}
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.tag }}
          artifacts: dist/*.tar.gz
          bin: josh josh-filter
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-signed-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, sign]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-release-plan
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-signed-bundle
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TOOL_NAME: ${{ needs.prepare.outputs.name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TOOL_NAME $RELEASE_VERSION" \
            --notes-file release/notes.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
