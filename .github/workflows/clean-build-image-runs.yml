name: Clean Build Image Runs

on:
  # Only delete the completed run by ID; never check out its code or consume its artifacts.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows:
      - Build Container Images
    types:
      - completed

concurrency:
  group: clean-build-image-runs-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  delete-run:
    # Keep manually dispatched runs for debugging.
    if: github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh api -X DELETE "/repos/$REPO/actions/runs/$RUN_ID"
